<style>
:root{
  --bg:#FFFFFF; --text:#111216; --sub:#6B6F80; --muted:#8E92A3; --line:#ECEEF4; --line2:#F1F2F6;
  --soft:#F6F7FB; --chip:#F2F3F7; --chip-text:#2E3140; --field:#FFFFFF;
  --ink:#111216; --ink-fg:#FFFFFF; --nav:#111216; --nav-off:#B4B7C4;
  --blue:#3B5BFD; --blue-soft:#EEF1FF; --blue-text:#2741D9;
  --lav:#C3C6F7; --lav-soft:#E6E7FB; --lav-text:#1E2170; --lav-tile:#E6E7FB; --tile-sub:#4A4E6A;
  --lime:#D9F65C; --lime-soft:#EEFBC0; --lime-text:#3F4A00;
  --g-bg:#F3FBD6; --n-bg:#FFF6DC; --h-bg:#FFECE8;
  --g-badge:#E4F99A; --n-badge:#FFE39A; --h-badge:#FFC7BD;
  --g-dot:#5E7A00; --n-dot:#B07A00; --h-dot:#D23A22;
  --hatch:repeating-linear-gradient(135deg,#9C9FD8 0 2px,#F2F3FB 2px 6px);
  --empty:#F6F7FB; --good:#8ED99B; --heavy:#FFE07A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1014; --text:#F2F3F7; --sub:#A2A6B8; --muted:#7D8194; --line:#262833; --line2:#20222B;
    --soft:#181A21; --chip:#1E2029; --chip-text:#DADCE6; --field:#22242E;
    --ink:#F2F3F7; --ink-fg:#111216; --nav:#1E2029; --nav-off:#9A9EB0;
    --blue-soft:#1C2350; --blue-text:#A8B7FF;
    --lav-soft:#252748; --lav-text:#1E2170; --lav-tile:#252748; --tile-sub:#B8BBD8;
    --lime-soft:#2A3110; --lime-text:#E4F99A;
    --g-bg:#1F2610; --n-bg:#2B2410; --h-bg:#311E1A;
    --hatch:repeating-linear-gradient(135deg,#7D80C4 0 2px,#1B1C2A 2px 6px);
    --empty:#181A21;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1014; --text:#F2F3F7; --sub:#A2A6B8; --muted:#7D8194; --line:#262833; --line2:#20222B;
  --soft:#181A21; --chip:#1E2029; --chip-text:#DADCE6; --field:#22242E;
  --ink:#F2F3F7; --ink-fg:#111216; --nav:#1E2029; --nav-off:#9A9EB0;
  --blue-soft:#1C2350; --blue-text:#A8B7FF;
  --lav-soft:#252748; --lav-text:#1E2170; --lav-tile:#252748; --tile-sub:#B8BBD8;
  --lime-soft:#2A3110; --lime-text:#E4F99A;
  --g-bg:#1F2610; --n-bg:#2B2410; --h-bg:#311E1A;
  --hatch:repeating-linear-gradient(135deg,#7D80C4 0 2px,#1B1C2A 2px 6px);
  --empty:#181A21;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:480px;margin:0 auto;padding-bottom:120px}
.hd{padding:20px 20px 8px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.logo{width:26px;height:26px;border-radius:13px;background:var(--lime);color:#111216;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;overflow:hidden;flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo.xl{width:88px;height:88px;border-radius:24px;font-size:38px}
.setrow{display:flex;align-items:center;gap:16px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5;color:var(--text)}
.steps b{font-weight:500}
.linkbox{font-size:13px;background:var(--soft);border-radius:14px;padding:12px 14px;word-break:break-all;user-select:all;color:var(--chip-text)}
label.btn{cursor:pointer}
.h1{margin:0;font-size:32px;font-weight:400;line-height:1.2;letter-spacing:-.03em;white-space:pre-line}
.h1.sm{font-size:30px}
.pill-btn{min-height:36px;border:none;border-radius:18px;background:var(--chip);color:var(--chip-text);padding:0 14px;font-size:13px}
.status{font-size:12px;color:var(--sub);background:var(--chip);border-radius:12px;padding:4px 10px}
.circle{width:40px;height:40px;flex:0 0 40px;border:none;border-radius:20px;background:var(--chip);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.circle.lg{width:44px;height:44px;flex-basis:44px;border-radius:22px}
.weekrow{display:flex;align-items:center;gap:4px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{height:58px;border:none;border-radius:29px;background:var(--chip);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
.day .d{font-size:11px;color:var(--sub)}
.day .n{font-size:16px;font-weight:500}
.day.on{background:var(--lime);color:#111216}
.day.on .d{color:#3F4A00}
.day .dot{position:absolute;bottom:6px;width:4px;height:4px;border-radius:2px;background:var(--blue)}
.day.on .dot{background:#111216}
.day.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--text)}
.note{align-self:flex-start;font-size:12px;background:var(--chip);color:var(--chip-text);border-radius:12px;padding:4px 10px}
.bento{padding:10px 16px 6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hero{grid-column:span 2;position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:24px;padding:18px 20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.hero .lbl{font-size:13px;color:#E1E6FF}
.hero .big{font-size:52px;font-weight:400;letter-spacing:-.03em;line-height:1.05}
.hero .big small{font-size:18px}
.hero{gap:16px}
.hero .nt{font-size:20px;font-weight:500;letter-spacing:-.02em}
.nbtn{min-height:40px;border:none;border-radius:20px;padding:0 14px;font-size:13px;background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;gap:6px}
.nbtn.p{background:#D9F65C;color:#111216;font-weight:500}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{min-height:32px;border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:0 11px;font-size:12px;background:transparent;color:#fff;display:inline-flex;align-items:center;gap:4px}
.tchip.on{background:#D9F65C;border-color:#D9F65C;color:#111216}
.card{scroll-margin-top:calc(16px + env(safe-area-inset-top,0px))}
.hero .arrow{width:28px;height:28px;border-radius:14px;background:var(--lime);color:#111216;display:flex;align-items:center;justify-content:center}
.hero svg.deco{position:absolute;pointer-events:none}
.tile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px}
.tile.lav{background:var(--lav-tile)}
.tile.out{border:1px solid var(--line)}
.tile .lbl{font-size:13px;color:var(--tile-sub)}
.tile.out .lbl,.tile.out .s{color:var(--sub)}
.tile .v{font-size:30px;font-weight:400;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--tile-sub)}
main{padding:8px 16px 0;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:26px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;flex:1}
.count{font-size:13px;border-radius:14px;padding:5px 11px;background:var(--chip);color:var(--chip-text)}
.count.blue{background:var(--blue-soft);color:var(--blue-text)}
.count.lav{background:var(--lav-soft);color:var(--text)}
.count.lime{background:var(--lime-soft);color:var(--lime-text)}
.count.ink{background:var(--ink);color:var(--ink-fg)}
.list{display:flex;flex-direction:column}
.exrow{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line2)}
.tag{font-size:12px;color:var(--blue-text);background:var(--blue-soft);border-radius:12px;padding:3px 10px;white-space:nowrap}
.exrow .nm{flex:1;font-size:15px;min-width:0}
.exrow .min{font-size:22px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.exrow .min small{font-size:12px;color:var(--sub)}
.x{width:36px;height:44px;flex:0 0 36px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.panel{background:var(--soft);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;border:none;border-radius:18px;background:var(--chip);color:var(--chip-text);padding:0 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.panel .chip{background:var(--field)}
.chip.blue{background:var(--blue);color:#fff}
.chip.lav{background:var(--lav);color:#1E2170}
.chip.ink{background:var(--ink);color:var(--ink-fg)}
.chip.big{min-height:42px;border-radius:21px;padding:0 16px;font-size:14px}
.chip.dash{background:transparent;border:1px dashed var(--muted);color:var(--sub)}
.field{height:46px;border:none;border-radius:16px;background:var(--field);padding:0 14px;font-size:16px;outline:none;min-width:0;width:100%}
.field.round{border-radius:22px;background:var(--soft);height:44px}
.field.min{width:64px;flex:0 0 64px;text-align:center;padding:0 6px}
.btn{height:48px;border:none;border-radius:24px;background:var(--ink);color:var(--ink-fg);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.sq{width:44px;height:44px;flex:0 0 44px;border-radius:22px;padding:0}
.hint{font-size:12px;color:var(--sub)}
.check{flex:1;min-height:48px;border:none;background:transparent;display:flex;align-items:center;gap:12px;padding:0;text-align:left}
.box{width:26px;height:26px;flex:0 0 26px;border-radius:13px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:#111216}
.box.on{background:var(--lime);border-color:var(--lime)}
.done{color:var(--muted);text-decoration:line-through}
.meal{display:flex;flex-direction:column;gap:6px}
.meal label{width:36px;flex:0 0 36px;font-size:14px;color:var(--sub)}
.meal .field{height:48px;background:var(--soft)}
.meal .field.g{background:var(--g-bg)} .meal .field.n{background:var(--n-bg)} .meal .field.h{background:var(--h-bg)}
.mmeta{display:flex;align-items:center;gap:8px;padding-left:46px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border:none;border-radius:12px;padding:3px 10px 3px 7px;color:#111216;min-height:24px}
.badge i{width:7px;height:7px;border-radius:4px;display:inline-block}
.badge.g{background:var(--g-badge)} .badge.g i{background:var(--g-dot)}
.badge.n{background:var(--n-badge)} .badge.n i{background:var(--n-dot)}
.badge.h{background:var(--h-badge)} .badge.h i{background:var(--h-dot)}
.nutri{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.rate{min-height:32px;border:1px solid var(--line);border-radius:16px;background:transparent;color:var(--sub);font-size:12px;padding:0 11px;display:inline-flex;align-items:center;gap:5px}
.rate i{width:7px;height:7px;border-radius:4px;display:inline-block}
.rate.g i{background:var(--g-dot)} .rate.n i{background:var(--n-dot)} .rate.h i{background:var(--h-dot)}
.rate.on{color:#111216;font-weight:500}
.rate.g.on{background:var(--g-badge);border-color:var(--g-badge)} .rate.n.on{background:var(--n-badge);border-color:var(--n-badge)} .rate.h.on{background:var(--h-badge);border-color:var(--h-badge)}
.lvbadge{font-size:12px;border-radius:12px;padding:2px 9px}
.hatch{width:22px;height:22px;border-radius:11px;border:1.5px solid #9C9FD8;background:var(--hatch)}
.symrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{height:42px;border:none;border-radius:21px;background:var(--field);font-size:14px}
.seg button.on{background:var(--ink);color:var(--ink-fg)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:64px;background:var(--nav);border-radius:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px;gap:4px;z-index:5;box-shadow:0 8px 24px rgba(17,18,22,.18)}
nav.tabs button{border:none;border-radius:24px;background:transparent;color:var(--nav-off);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
nav.tabs button.on{background:var(--lime);color:#111216;font-weight:500}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--lav-tile);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.stats3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gt{border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gt .v{font-size:22px;font-weight:400;letter-spacing:-.02em;white-space:nowrap}
.gt .v small{font-size:12px;opacity:.75}
.gt .l{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpill{min-width:44px;text-align:center;font-size:13px;border-radius:12px;padding:3px 8px;font-variant-numeric:tabular-nums}
.mcal{row-gap:6px}
.mcal .mday{height:46px;position:relative;display:flex;align-items:center;justify-content:center;background:transparent;border:none;padding:0}
.mday .mc{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums}
.mday.today .mc{font-weight:600}
.mday.sel .mc{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.mday .hhdot{position:absolute;top:3px;right:calc(50% - 21px);width:8px;height:8px;border-radius:4px;background:#9A9EAE;box-shadow:0 0 0 2px var(--bg)}
.mday .mc.sym{border:2px dashed #6E72C9}
.mday .symmark{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:16px;height:5px;border-radius:3px;background:repeating-linear-gradient(135deg,#7D80C4 0 2px,transparent 2px 4px)}
.mday .hvbar{position:absolute;top:4px;left:calc(50% - 19px);width:8px;height:8px;border-radius:4px;background:var(--heavy);box-shadow:0 0 0 2px var(--bg)}
.symdot{position:absolute;right:6px;top:5px;width:7px;height:7px;border-radius:4px;background:var(--hatch);box-shadow:0 0 0 1px #7D80C4}
.stat .v{font-size:24px;font-weight:400;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--tile-sub)}
.wgrid{display:grid;grid-template-columns:76px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.wl.sub{padding-left:8px;color:var(--text);text-overflow:ellipsis}
.wsub{font-size:11px;color:var(--sub);margin:12px 0 -6px}
.wh{height:44px;border:none;border-radius:22px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.wh .d{font-size:10px;color:var(--sub)} .wh .n{font-size:13px;font-weight:500}
.wh.on{box-shadow:inset 0 0 0 2px var(--text)} .wh .d{color:inherit;opacity:.7}
.wl{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden}
.wc{height:26px;border-radius:13px;background:var(--empty);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;border:none;padding:0;color:var(--text)}
.wc.dim{opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 4px 0}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.legend i{width:9px;height:9px;border-radius:5px;display:inline-block}
.dgroup{display:flex;gap:12px;align-items:flex-start}
.dgroup .k{width:48px;flex:0 0 48px;font-size:13px;color:var(--sub);padding-top:6px}
.dchip{font-size:13px;border-radius:15px;padding:6px 12px;background:var(--chip);color:var(--chip-text)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:8px}
.cal .wd{text-align:center;font-size:12px;color:var(--sub)}
.cal button{height:40px;border:none;background:transparent;font-size:14px;padding:0;color:var(--sub)}
.bar{flex:1;height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ink-fg);font-size:13px;padding:10px 16px;border-radius:20px;z-index:9;max-width:calc(100% - 40px)}
.empty{font-size:14px;color:var(--sub)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<script>
(function(){
'use strict';
var MEALS=['아침','점심','저녁','간식'];
var PARTS=['전신','허리','엉덩이','가슴','등','하체'];
var WD=['월','화','수','목','금','토','일'];
var FULLWD=['월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
var LVNAME={g:'건강',n:'보통',h:'헤비'};
var LS_KEY='do:v1';
function applyTheme(t){var r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');try{localStorage.setItem('do:theme',t||'system')}catch(e){}}
try{applyTheme(localStorage.getItem('do:theme')||'system')}catch(e){}

var S={view:'day',sel:null,wkSel:null,monthOf:null,days:{},
  config:{faceQuick:['뷰앤디','얼굴 괄사','허리 괄사','이모저모'],supps:['유산균','마그네슘','혈당','혈행']},
  mode:'loading',uid:null,db:null,sample:null,assets:null,uploading:false,
  form:{part:'',name:'',min:''},symForm:{name:'',level:1,memo:''},
  draft:{face:'',grow:'',supp:''},addingSupp:false,ui:{}};

/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function dow(s){return (pd(s).getDay()+6)%7}
function monday(s){return addDays(s,-dow(s))}
function today(){return ds(new Date())}
function md(s){var d=pd(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
S.sel=today();

/* ---------- utils ---------- */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}

var chains={};
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({days:S.days,config:S.config}))}catch(e){}}
function loadLocal(){try{var v=localStorage.getItem(LS_KEY);if(v){var o=JSON.parse(v);S.days=o.days||{};if(o.config)S.config=o.config}}catch(e){}}

function saveDay(s){var d=S.days[s];if(!d)return;if(isEmpty(d)){delete S.days[s];writeDoc(s,null)}else writeDoc(s,clone(d))}
function saveConfig(){writeDoc('config',clone(S.config))}
function mutate(s,fn,noRender){var d=clone(getDay(s));fn(d);S.days[s]=d;saveDay(s);if(!noRender)render()}

/* ---------- derived ---------- */
function exMin(d){return d.ex.reduce(function(a,e){return a+(Number(e.min)||0)},0)}
function quickList(){
  var cnt={},last={};Object.keys(S.days).sort().forEach(function(k){(S.days[k].ex||[]).forEach(function(e){if(!e.name)return;cnt[e.name]=(cnt[e.name]||0)+1;last[e.name]=e})});
  return Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,10).map(function(n){return last[n]});
}

app.addEventListener('input',function(e){var t=e.target;if(t.dataset.bind){var v=t.value;if(t.dataset.bind==='form.min'){v=v.replace(/[^0-9]/g,'');if(v!==t.value)t.value=v}setBind(t.dataset.bind,v)}});
app.addEventListener('keydown',function(e){var t=e.target;if(e.key!=='Enter'||t.tagName!=='INPUT')return;if(t.dataset.enter){e.preventDefault();act(t.dataset.enter,t)}else if(t.dataset.meal){e.preventDefault();t.blur()}});
app.addEventListener('change',function(e){var t=e.target;if(t.id==='logoFile'){if(t.files&&t.files[0])setLogo(t.files[0]);return}if(t.id==='importFile'){if(t.files&&t.files[0])importFile(t.files[0]);return}if(!t.dataset.meal)return;var meal=t.dataset.meal,text=t.value.trim(),s=S.sel;
  var prev=(getDay(s).meals[meal]||{}).text||'';if(text===prev)return;
  if(!text){mutate(s,function(d){delete d.meals[meal]});return}
  var skip=/^(-|x|안\s?먹음|굶음|skip)$/i.test(text);
  mutate(s,function(d){var old=d.meals[meal]||{};d.meals[meal]={text:text,lv:skip?null:(old.lv||null)};if(skip)d.meals[meal].skip=true})});
app.addEventListener('focusout',function(){setTimeout(function(){if(pending)scheduleRender()},0)});
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||!app.contains(b))return;act(b.dataset.act,b)});

function act(a,el){
  var s=S.sel,i=el.dataset.i!=null?+el.dataset.i:null,v=el.dataset.v;
  switch(a){
  case 'view':S.view=v;if(v==='month')S.monthOf=S.sel;render();window.scrollTo(0,0);break;
  case 'theme':S.config.theme=v;applyTheme(v);saveConfig();render();break;
  case 'logoReset':S.logo=null;try{localStorage.removeItem('do:logo')}catch(e){}render();break;
  case 'export':exportData();break;
  case 'goToday':S.sel=today();render();window.scrollTo(0,0);break;
  case 'pick':S.sel=el.dataset.d;render();break;
  case 'shift':S.sel=addDays(S.sel,+el.dataset.n);if(S.view==='day'&&monday(S.sel)===monday(today()))S.sel=today();S.wkSel=null;render();break;
  case 'msel':S.mSel=el.dataset.d;render();break;
  case 'wsel':S.wkSel=el.dataset.d;render();break;
  case 'open':S.sel=el.dataset.d;S.view='day';render();window.scrollTo(0,0);break;
  case 'mshift':var m=pd(S.monthOf||S.sel);m=new Date(m.getFullYear(),m.getMonth()+(+el.dataset.n),1);S.monthOf=ds(m);render();break;
  case 'part':S.form.part=S.form.part===v?'':v;render();break;
  case 'exAdd':var nm=S.form.name.trim(),mn=S.form.min;if(!nm&&!mn){toast('운동 이름이나 분을 적어주세요.');return}
    mutate(s,function(d){d.ex.push({part:S.form.part,name:nm,min:mn?+mn:null})},true);S.form.name='';S.form.min='';render();var f=document.getElementById('exName');if(f)f.focus();break;
  case 'quick':var q=S.ui.quick[i];mutate(s,function(d){d.ex.push({part:q.part||'',name:q.name,min:q.min==null?null:q.min})});toast(q.name+' 추가했어요');break;
  case 'go':var tg=document.getElementById(v);if(tg)tg.scrollIntoView({behavior:'smooth',block:'start'});var ff=el.dataset.f&&document.getElementById(el.dataset.f);if(ff)setTimeout(function(){ff.focus({preventScroll:true})},350);break;
  case 'nudgeEx':var q0=quickList()[0];if(!q0)return;mutate(s,function(d){d.ex.push({part:q0.part||'',name:q0.name,min:q0.min==null?null:q0.min})});toast(q0.name+' 기록했어요');break;
  case 'exDel':mutate(s,function(d){d.ex.splice(i,1)});break;
  case 'faceDel':var fv=S.ui.face[i];mutate(s,function(d){var k=d.face.indexOf(fv);if(k>=0)d.face.splice(k,1)});break;
  case 'faceQ':var fqv=S.ui.faceQ[i];mutate(s,function(d){if(d.face.indexOf(fqv)<0)d.face.push(fqv)});break;
  case 'faceAdd':var fn=S.draft.face.trim();if(!fn)return;S.config.faceQuick=S.config.faceQuick||[];if(S.config.faceQuick.indexOf(fn)<0){S.config.faceQuick.push(fn);saveConfig()}S.draft.face='';mutate(s,function(d){if(d.face.indexOf(fn)<0)d.face.push(fn)});break;
  case 'growT':mutate(s,function(d){d.grows[i].done=!d.grows[i].done});break;
  case 'growDel':mutate(s,function(d){d.grows.splice(i,1)});break;
  case 'growAdd':var gn=S.draft.grow.trim();if(!gn)return;S.draft.grow='';mutate(s,function(d){d.grows.push({label:gn,done:false})},true);render();var gi=document.getElementById('growNew');if(gi)gi.focus();break;
  case 'supp':var sv=S.ui.supps[i];mutate(s,function(d){var k=d.supps.indexOf(sv);if(k>=0)d.supps.splice(k,1);else d.supps.push(sv)});break;
  case 'suppOpen':S.addingSupp=!S.addingSupp;render();if(S.addingSupp){var si=document.getElementById('suppNew');if(si)si.focus()}break;
  case 'suppAdd':var sn=S.draft.supp.trim();if(!sn)return;if(S.config.supps.indexOf(sn)<0){S.config.supps.push(sn);saveConfig()}S.draft.supp='';S.addingSupp=false;render();break;
  case 'rate':var rk=el.dataset.k;mutate(s,function(d){var x=d.meals[v];if(!x)return;x.lv=x.lv===rk?null:rk;delete x.lvManual;delete x.kcal;delete x.c;delete x.p;delete x.f;delete x.ai});break;
  case 'symPick':S.symForm.name=S.symForm.name===v?'':v;render();break;
  case 'symLv':S.symForm.level=i;render();break;
  case 'symAdd':var yn=S.symForm.name.trim();if(!yn){toast('증상을 골라주거나 적어주세요.');return}mutate(s,function(d){d.syms.push({name:yn,level:S.symForm.level,memo:S.symForm.memo.trim()})},true);S.symForm={name:'',level:1,memo:''};render();break;
  case 'symDel':mutate(s,function(d){d.syms.splice(i,1)});break;
  }
}

function setLogo(file){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var n=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');c.width=c.height=240;
    c.getContext('2d').drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,240,240);URL.revokeObjectURL(url);
    var d=c.toDataURL('image/jpeg',.85);try{localStorage.setItem('do:logo',d);S.logo=d;toast('앱 사진을 바꿨어요')}catch(e){toast('사진을 저장하지 못했어요.')}render()};
  img.onerror=function(){URL.revokeObjectURL(url);toast('이 사진 형식은 열 수 없어요.')};
  img.src=url;
}
function stamp(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function exportData(){
  var data=JSON.stringify({app:'do',version:1,exportedAt:new Date().toISOString(),days:S.days,config:S.config},null,1);
  var name='do-backup-'+stamp()+'.json',blob=new Blob([data],{type:'application/json'});
  var mark=function(){S.lastBackup=stamp();try{localStorage.setItem('do:lastBackup',S.lastBackup)}catch(e){}render()};
  try{var f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(mark).catch(function(e){if(e&&e.name!=='AbortError')toast('내보내지 못했어요.')});return}}catch(e){}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);mark();
}
function importFile(file){
  var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||o.app!=='do'||typeof o.days!=='object')throw 0;
      var n=0;Object.keys(o.days).forEach(function(k){if(/^\d{4}-\d\d-\d\d$/.test(k)&&o.days[k]&&typeof o.days[k]==='object'){S.days[k]=o.days[k];n++}});
      if(o.config&&typeof o.config==='object'){['faceQuick','supps','theme'].forEach(function(k){if(o.config[k]!=null)S.config[k]=o.config[k]});applyTheme(S.config.theme)}
      persistLocal();render();toast(n+'일치 기록을 불러왔어요')}catch(e){toast('do 백업 파일이 아니에요.')}};
  r.onerror=function(){toast('파일을 읽지 못했어요.')};
  r.readAsText(file);
}

/* ---------- boot ---------- */
loadLocal();applyTheme(S.config.theme);
try{S.logo=localStorage.getItem('do:logo');S.lastBackup=localStorage.getItem('do:lastBackup')}catch(e){}
S.mode='local';render();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
